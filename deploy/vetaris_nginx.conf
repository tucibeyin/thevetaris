# Vetaris - nginx reverse proxy + Let's Encrypt SSL
#
# Kurulum:
#   1. Bu dosyayı /etc/nginx/sites-available/thevetaris olarak kopyala
#   2. sudo ln -s /etc/nginx/sites-available/thevetaris /etc/nginx/sites-enabled/
#   3. Sertifika yoksa:  sudo certbot --nginx -d thevetaris.com -d www.thevetaris.com
#      (aşağıdaki 443 / redirect bloklarını certbot otomatik üretir)
#   4. sudo nginx -t && sudo systemctl reload nginx

server {
    server_name thevetaris.com www.thevetaris.com;

    location / {
        # Python sunucusuna (Port 8801) yönlendir
        proxy_pass http://127.0.0.1:8801;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/thevetaris.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/thevetaris.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.thevetaris.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = thevetaris.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name thevetaris.com www.thevetaris.com;
    return 404; # managed by Certbot
}
